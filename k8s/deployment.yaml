apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-deployment
  namespace: wiki
  labels:
    app: personal-wiki
spec:
  replicas: 1
  strategy:
    type: Recreate  # Since we're using local storage
  selector:
    matchLabels:
      app: personal-wiki
  template:
    metadata:
      labels:
        app: personal-wiki
    spec:
      containers:
      - name: wiki
        image: wiki:latest
        imagePullPolicy: IfNotPresent  # Use local image
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: wiki-config
        volumeMounts:
        - name: wiki-data
          mountPath: /app/data
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/pages
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/pages
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: wiki-data
        persistentVolumeClaim:
          claimName: wiki-data-pvc