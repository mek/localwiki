<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Wiki</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/perl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/tcl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📚 Wiki</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search pages..." />
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
            
            <div class="new-page-section">
                <input type="text" id="newPageName" placeholder="New page title" />
                <button id="createPageBtn" class="btn btn-primary">Create</button>
            </div>

            <div class="page-list-container">
                <h3>Pages</h3>
                <ul class="page-list" id="pageList">
                    <li class="loading">Loading pages...</li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <!-- View Mode -->
            <div id="viewMode" class="mode-container">
                <div class="header">
                    <div class="title-section">
                        <h1 id="viewPageTitle">Loading...</h1>
                        <div class="page-meta" id="viewPageMeta"></div>
                    </div>
                    <div class="toolbar">
                        <button id="editBtn" class="btn btn-primary" title="Edit page (Ctrl/Cmd+E)">✏️ Edit</button>
                        <button id="deleteBtn" class="btn btn-danger" style="display: none;" title="Delete page">Delete</button>
                        <button id="helpBtn" class="btn btn-secondary" title="Keyboard shortcuts">?</button>
                    </div>
                </div>
                <div class="content-area">
                    <div id="viewContent" class="view-content">Loading...</div>
                </div>
            </div>

            <!-- Edit Mode -->
            <div id="editMode" class="mode-container" style="display: none;">
                <div class="header">
                    <div class="title-section">
                        <h1 id="editPageTitle">Editing...</h1>
                        <div class="page-meta" id="editPageMeta"></div>
                    </div>
                    <div class="toolbar">
                        <div class="edit-mode-buttons">
                            <button id="editorOnlyBtn" class="btn btn-secondary active">Editor</button>
                            <button id="previewOnlyBtn" class="btn btn-secondary">Preview</button>
                            <button id="splitViewBtn" class="btn btn-secondary">Split</button>
                        </div>
                        <div class="edit-actions">
                            <button id="saveBtn" class="btn btn-primary">Save</button>
                            <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="content-area" id="editContentArea">
                    <!-- Editor Panel -->
                    <div id="editorPanel" class="editor-panel">
                        <div class="panel-header">
                            <span class="panel-title">✏️ Editor</span>
                            <div class="editor-tools">
                                <button class="tool-btn" title="Bold" onclick="insertMarkdown('**', '**')">B</button>
                                <button class="tool-btn" title="Italic" onclick="insertMarkdown('*', '*')">I</button>
                                <button class="tool-btn" title="Code" onclick="insertMarkdown('`', '`')">C</button>
                                <button class="tool-btn" title="Wiki Link" onclick="insertWikiLink()">[[]]</button>
                            </div>
                        </div>
                        <textarea id="editor" placeholder="Start writing your markdown..."></textarea>
                    </div>

                    <!-- Preview Panel -->
                    <div id="previewPanel" class="preview-panel" style="display: none;">
                        <div class="panel-header">
                            <span class="panel-title">👀 Preview</span>
                        </div>
                        <div id="preview" class="preview-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for confirmations -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="modalCancel" class="btn btn-secondary">Cancel</button>
                <button id="modalConfirm" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
